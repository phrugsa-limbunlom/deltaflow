site_name: DeltaFlow
repo_url: https://github.com/yourname/deltaflow
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
    - scheme: slate
      primary: indigo

nav:
  - Home: index.md
  - Getting Started: getting-started.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
