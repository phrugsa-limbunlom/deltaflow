site_name: DeltaFlow
site_description: >-
  Flow matching, mini-batch optimal-transport coupling, and posterior sampling
  for inverse problems in PyTorch.
site_author: Phrugsa Limbunlom
site_url: https://phrugsa-limbunlom.github.io/deltaflow/

repo_url: https://github.com/phrugsa-limbunlom/deltaflow
repo_name: phrugsa-limbunlom/deltaflow
edit_uri: edit/main/docs/

copyright: Copyright &copy; Phrugsa Limbunlom. MIT License.

theme:
  name: material
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo.svg
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Guides:
      - Flow Matching: guides/flow-matching.md
      - Delta Alignment: guides/delta-alignment.md
      - Training at Image Scale: guides/training.md
      - Inverse Problems: guides/inverse-problems.md
  - Concepts:
      - Architecture: concepts/architecture.md
  - Examples: examples.md
  - API Reference:
      - Overview: api/index.md
      - core: api/core.md
      - interpolants: api/interpolants.md
      - losses: api/losses.md
      - solvers: api/solvers.md
      - samplers: api/samplers.md
      - models: api/models.md
      - inverse: api/inverse.md
      - trainer: api/trainer.md
      - datasets: api/datasets.md
      - utils: api/utils.md
  - Contributing: contributing.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            merge_init_into_class: true
            signature_crossrefs: true
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - assets/js/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - assets/css/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/phrugsa-limbunlom/deltaflow
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/torchdeltaflow/
