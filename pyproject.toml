[build-system]
requires = ["setuptools>=64", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "deltaflow"
dynamic = ["version"]
description = "Flow matching and anatomy-invariant guidance alignment for radiograph generative pretraining"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Your Name" }]
requires-python = ">=3.9"
keywords = [
    "deep-learning",
    "flow-matching",
    "generative-models",
    "medical-imaging",
    "radiography",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]

dependencies = [
    "torch>=2.0",
    "numpy",
    "einops",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=24.0",
    "isort>=5.0",
    "mypy>=1.0",
]
docs = [
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.18",
    "pymdown-extensions>=9.0",
]

[project.urls]
Homepage = "https://github.com/yourname/deltaflow"
Repository = "https://github.com/yourname/deltaflow"

[tool.setuptools.packages.find]
include = ["deltaflow*"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
