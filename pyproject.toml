[build-system]
requires = ["setuptools>=64", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "torchdeltaflow"
dynamic = ["version"]
description = "Flow matching, mini-batch optimal transport coupling, and posterior sampling for inverse problems in PyTorch"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Phrugsa Limbunlom", email = "phrugsa.lim@gmail.com" },
]
maintainers = [
    { name = "Phrugsa Limbunlom", email = "phrugsa.lim@gmail.com" },
]
requires-python = ">=3.9"
keywords = [
    "pytorch",
    "flow-matching",
    "rectified-flow",
    "optimal-transport",
    "diffusion-models",
    "generative-models",
    "posterior-sampling",
    "inverse-problems",
    "medical-imaging",
    "deep-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Keep the runtime footprint minimal: torch + a few pure-python utilities,
# plus scipy for the exact Hungarian-algorithm mini-batch OT assignment
# (deltaflow.interpolants.OTInterpolant, deltaflow.trainer.OTCoupling). A
# greedy nearest-neighbour matcher remains as a defensive fallback if scipy
# is ever missing from the environment. Everything else domain-specific
# (image loading, dev tooling, docs) is an optional extra, in the same
# spirit as torchebm.
dependencies = [
    "torch>=2.0",
    "numpy",
    "einops",
    "tqdm",
    "scipy>=1.10",
]

[project.optional-dependencies]
# Image dataset streaming (deltaflow.trainer.data.ImageFolderStream,
# deltaflow.datasets.radiograph.RadiographDataset).
images = [
    "pillow>=9.0",
]
# Kept for backwards compatibility, scipy is now a core dependency.
ot = [
    "scipy>=1.10",
]
# Convenience aggregate for a full install (all optional runtime extras).
all = [
    "pillow>=9.0",
    "scipy>=1.10",
]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=24.0",
    "isort>=5.0",
    "mypy>=1.0",
    "pillow>=9.0",
    "scipy>=1.10",
]
docs = [
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.18",
    "pymdown-extensions>=9.0",
]

[project.urls]
Homepage = "https://github.com/phrugsa-limbunlom/deltaflow"
Repository = "https://github.com/phrugsa-limbunlom/deltaflow"
Issues = "https://github.com/phrugsa-limbunlom/deltaflow/issues"
Changelog = "https://github.com/phrugsa-limbunlom/deltaflow/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["deltaflow*"]

[tool.setuptools_scm]
# Auto-derive the version from the nearest git tag (e.g. v0.1.0 -> 0.1.0).
# Falls back to "0.0.0.dev0" only when the tree has no tags at all.
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
