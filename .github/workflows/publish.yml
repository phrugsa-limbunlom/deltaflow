name: publish

# Automated tagging and release for torchdeltaflow.
#
# On every merge to main this pipeline cuts a new release:
#
#   1. update-tag derives the next semantic version from the latest tag and the
#      merge-commit message (include "#major" or "#minor" to bump those
#      components, otherwise the patch component bumps), then creates and pushes
#      the "vX.Y.Z" tag. The tag is the single source of truth for the version,
#      setuptools_scm derives the package version from it (distance 0 -> clean
#      PEP 440 release, e.g. v0.2.3 -> "0.2.3").
#
#   2. release checks out that tag, builds and validates the sdist + wheel,
#      runs the test suite, verifies the built version matches the tag, publishes
#      to PyPI, and opens a GitHub Release whose notes come from the matching
#      CHANGELOG.md section (falling back to GitHub's generated notes).
#
# Because the tag is pushed with the workflow's GITHUB_TOKEN, it does not
# recursively trigger this workflow, so there is no separate tag-push trigger.
# Use "Run workflow" (workflow_dispatch) to cut a release manually.
#
# Authentication uses a PyPI API token stored as the repository secret
# PYPI_API_TOKEN. Create the token at https://pypi.org/manage/account/token/
# (scope it to the torchdeltaflow project), then add it under
# Settings > Secrets and variables > Actions as PYPI_API_TOKEN.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.create_tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the full history and all tags to find the latest version.
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version bump from commit message
        id: bump
        run: |
          message=$(git log -1 --pretty=%B)
          if echo "$message" | grep -qiE '#major'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$message" | grep -qiE '#minor'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute and push the next tag
        id: create_tag
        run: |
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          bump=${{ steps.bump.outputs.type }}

          if [ -z "$latest_tag" ]; then
            new_tag="v0.1.0"
          else
            version=${latest_tag#v}
            IFS='.' read -r major minor patch <<< "$version"
            case "$bump" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            new_tag="v${major}.${minor}.${patch}"
          fi

          if git rev-parse "$new_tag" >/dev/null 2>&1; then
            echo "Tag $new_tag already exists, skipping tag creation."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$new_tag" -m "Release $new_tag"
            git push origin "$new_tag"
          fi

          echo "new_tag=${new_tag}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${new_tag}"

  release:
    needs: update-tag
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/torchdeltaflow/
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the freshly created tag so setuptools_scm resolves the
          # version to the tag exactly (distance 0, no ".devN").
          ref: ${{ needs.update-tag.outputs.new_tag }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Verify built version matches the tag
        run: |
          tag="${{ needs.update-tag.outputs.new_tag }}"
          expected="${tag#v}"
          built=$(ls dist/*.whl | sed -E 's#.*/torchdeltaflow-([^-]+)-.*#\1#')
          echo "Tag version: ${expected}"
          echo "Built version: ${built}"
          if [ "$built" != "$expected" ]; then
            echo "::error::Built version ${built} does not match tag ${expected}."
            exit 1
          fi

      - name: Run tests
        run: |
          pip install -e ".[dev]"
          pytest --cov=deltaflow

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # A manual re-run against an already-published version should be a
          # no-op rather than a hard failure.
          skip-existing: true

      - name: Extract release notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ needs.update-tag.outputs.new_tag }}
        run: |
          awk -v ver="${RELEASE_TAG#v}" '
            $0 ~ ("^## \\[" ver "\\]") {found=1; next}
            /^## \[/ {found=0}
            found
          ' CHANGELOG.md > release_body.md
          echo "Release notes for ${RELEASE_TAG}:"
          cat release_body.md

      - name: Create GitHub Release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.update-tag.outputs.new_tag }}
        with:
          script: |
            const fs = require('fs');
            let body = '';
            try { body = fs.readFileSync('release_body.md', 'utf8').trim(); } catch {}
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.RELEASE_TAG,
              name: process.env.RELEASE_TAG,
              body: body,
              draft: false,
              prerelease: false,
              generate_release_notes: true,
            });
